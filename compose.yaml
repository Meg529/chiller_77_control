services:
  app:
    container_name: chiller_77-261110
    image: chiller_images
    restart: unless-stopped
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ./analysis
        target: /app/analysis
    depends_on:
      postgres:
        condition: service_healthy

